# Le site est déjà généré (node outils/build.js) : Netlify publie le dépôt tel quel
# et installe seulement les dépendances des fonctions.
[build]
  publish = "."
  command = "echo 'Pages déjà générées'"

[functions]
  directory = "netlify/functions"

# Les fichiers de travail ne sont pas publiés
[[redirects]]
  from = "/_source/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/outils/*"
  to = "/404.html"
  status = 404
  force = true

# Fichiers techniques du dépôt : inutiles aux visiteurs
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# En-têtes de sécurité, envoyés avec toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    # Seuls les scripts du site s'exécutent ; rien ne peut afficher le site dans un cadre
    # Exception : le badge « Powered by Netlify », ajouté par Netlify sur l'offre gratuite.
    # Son script est autorisé par son empreinte (sha256-…). Si Netlify le modifie, le badge se fige
    # (le site, lui, continue de fonctionner) : relever la nouvelle empreinte dans la console du navigateur.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://app.netlify.com; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Application : le fichier qui gère l'installation doit toujours être à jour
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
